<style>
/* Rodrigo Soafer, link hub. D6 INDEX tokens, scoped to the web/EPK surface only
   (references/brand/rodrigo-soafer/tokens.css, --soafer-index-*). Layout from
   templates/phone-epk.html. Nothing under 16px. */
:root{
  --card:#ECE4D2;   /* --soafer-index-card */
  --ink:#1B1815;    /* --soafer-index-ink */
  --accent:#5B3FA6; /* --soafer-index-accent: featured number and rules only */
  --rule:#1B181555;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--card)}
body{
  background:var(--card);color:var(--ink);
  font-family:Epilogue,-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif;
  font-size:16px;line-height:1.35;
  font-kerning:normal;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;justify-content:center;
}
a{color:inherit}
.page{width:100%;max-width:390px;padding:24px 20px 48px}

/* Lockup: family mark above the wordmark, never redrawn (marks/README.md) */
.lk{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-decoration:none;font-weight:900;font-size:16px;line-height:1}
.lk .mk{display:inline-block;width:26px;height:26px;line-height:0}
.lk .mk svg{display:block;width:100%;height:100%}

/* The numbered entry (his own Apple Notes numbering as the structure) */
.entry{margin:80px 0 56px}
.lab{display:flex;gap:.4em;align-items:baseline;border-top:2px solid var(--accent);padding-top:.2em;margin-bottom:.35em;line-height:1.1;font-size:24px}
.lab .n{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.lab .d{opacity:.5}
.lab .t{font-weight:900;letter-spacing:-.02em}
.hero{font-weight:900;font-size:56px;letter-spacing:-.04em;line-height:.92}

.facts{font-weight:500;font-size:16px;line-height:1.35;margin:0 0 22px}
.facts b{display:block;font-weight:900;font-size:22px;letter-spacing:-.03em;margin-bottom:4px;color:var(--accent)}

.btns{display:flex;gap:8px;margin:0 0 24px}
.btns a{flex:1;text-align:center;padding:14px 0;font-weight:900;font-size:16px;background:var(--ink);color:var(--card);text-decoration:none}

.list{margin:0 0 22px;font-size:16px}
.r{display:flex;gap:.5em;align-items:baseline;border-top:1px solid var(--rule);padding:.22em 0;text-decoration:none}
.r:last-child{border-bottom:1px solid var(--rule)}
.n{font-weight:900;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.d{opacity:.5}
.t{font-weight:500}
.r.feat{color:var(--accent);border-top:2px solid var(--accent)}
.r.feat .t{font-weight:900}

.small{font-weight:500;font-size:16px;line-height:1.45;margin-top:40px}
.small b{font-weight:900}

@media (max-width:360px){.hero{font-size:48px}}
</style>
</head>
